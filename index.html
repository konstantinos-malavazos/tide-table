<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reef — find the four reefs</title>
<style>
  :root{
    --sea:#e8f0f5; --deep:#c3d4de; --ink:#14232e; --muted:#5d7180;
    --gone:#b9c6cf; --hot:#e8913c; --hit:#2e8b57; --miss:#c9463f; --line:#a9bcc7;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:#f2f7fa;color:var(--ink);display:flex;flex-direction:column;align-items:center;
    padding:20px 12px 40px;-webkit-text-size-adjust:100%}
  h1{font-family:Georgia,serif;font-size:26px;margin:0 0 2px;letter-spacing:.5px}
  .goal{font-size:15px;color:var(--muted);margin-bottom:16px}
  #board{display:grid;gap:2px;background:var(--line);border:2px solid var(--line);
    border-radius:8px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .c{width:38px;height:38px;background:var(--sea);display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;position:relative}
  .c.out{background:var(--gone);cursor:default;color:#8fa0ab}
  .c.r1{background:#fbe9d2} .c.r2{background:#f6cf9d} .c.r3{background:#efb069}
  .c.ping{background:var(--deep);color:#123;cursor:default}
  .c.mark::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid var(--hot)}
  .c.reef{background:var(--hit);color:#fff}
  .c.reef::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff}
  .c.wrong::after{border-color:var(--miss)}
  .bar{display:flex;gap:8px;margin:16px 0 10px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-size:15px;padding:10px 16px;border-radius:8px;border:1px solid #aebfc9;
    background:#fff;color:var(--ink);cursor:pointer}
  button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  button.go{background:var(--hot);border-color:var(--hot);color:#fff;font-weight:600}
  button:disabled{opacity:.4;cursor:default}
  .counts{display:flex;gap:22px;font-size:15px;margin-bottom:12px}
  .counts b{font-size:19px}
  #result{font-size:19px;font-weight:600;margin-top:14px;text-align:center;min-height:26px}
  #tip{font-size:14px;color:var(--muted);margin-top:8px;text-align:center;max-width:430px;min-height:20px}
  #teach{display:none;margin-top:14px;padding:14px 18px;border-radius:10px;max-width:452px;
    background:#fff5e8;border:2px solid var(--hot);text-align:center}
  #teach.show{display:block}
  #teach p{margin:0;font-size:15.5px;line-height:1.5}
  #teach .step{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  #teach button{margin-top:12px;padding:8px 15px;font-size:14px}
  #teach.waiting button{display:none}
  .pointer{outline:3px solid var(--hot);outline-offset:-3px;animation:pulse 1s infinite}
  @keyframes pulse{50%{outline-color:transparent}}
</style>
</head>
<body>
  <h1>Reef</h1>
  <div class="goal">Four reefs are hidden. Find them.</div>
  <div class="counts">
    <span>Pings left <b id="nping">10</b></span>
    <span>Reefs marked <b id="nmark">0</b> / 4</span>
  </div>
  <div id="board"></div>
  <div id="teach">
    <div class="step" id="cstep"></div>
    <p id="ctext"></p>
    <button id="cnext" class="go">Next</button>
    <button id="cskip">Skip</button>
  </div>
  <div id="tip"></div>
  <div class="bar">
    <button id="mping" class="on">Ping</button>
    <button id="mmark">Mark reef</button>
    <button id="reveal" class="go">Reveal</button>
  </div>
  <div class="bar">
    <button id="again">New board</button>
    <button id="howto">How to play</button>
  </div>
  <div id="result"></div>

<script>
"use strict";
var COLS=12, ROWS=8, REEFS=4, PINGS=10, SEP=2;
var N=COLS*ROWS;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function xy(i){return [i%COLS,(i/COLS)|0];}
function dist(a,b){var p=xy(a),q=xy(b);return Math.max(Math.abs(p[0]-q[0]),Math.abs(p[1]-q[1]));}

var seed=0, reefs=[], pings=new Map(), marks=new Set(), done=false, mode='ping';

// Reefs sit off the rim and at least SEP apart, so two of them never hide behind
// one reading.
function build(s){
  seed = (s===undefined||s===null) ? (Math.random()*1e9)|0 : (s>>>0);
  var rng=mulberry32(seed), ok=[];
  for(var i=0;i<N;i++){ var p=xy(i);
    if(p[0]>=1&&p[1]>=1&&p[0]<=COLS-2&&p[1]<=ROWS-2) ok.push(i); }
  reefs=[]; var guard=0;
  while(reefs.length<REEFS && guard++<9000){
    var c=ok[Math.floor(rng()*ok.length)];
    var clash=false;
    for(var k=0;k<reefs.length;k++) if(dist(c,reefs[k])<SEP) clash=true;
    if(!clash) reefs.push(c);
  }
  pings=new Map(); marks=new Set(); done=false; setMode('ping');
  document.getElementById('result').textContent='';
  draw();
}

// A ping reports how far the nearest reef is. That is the whole rule.
function reading(i){
  var best=99;
  for(var k=0;k<reefs.length;k++) best=Math.min(best,dist(i,reefs[k]));
  return best;
}

// Everything closer to a ping than its reading is empty for certain. That single
// fact is what makes this deducible rather than a guessing game.
function ruledOut(i){
  var it=pings.entries(), e;
  while(!(e=it.next()).done) if(dist(i,e.value[0])<e.value[1]) return true;
  return false;
}
// ...and each ping says at least one reef sits exactly on its ring. Count the
// rings a cell sits on and the board draws the deduction for you.
function ringCount(i){
  var n=0, it=pings.entries(), e;
  while(!(e=it.next()).done) if(dist(i,e.value[0])===e.value[1]) n++;
  return n;
}

function draw(){
  var b=document.getElementById('board');
  b.style.gridTemplateColumns='repeat('+COLS+',38px)';
  b.innerHTML='';
  for(var i=0;i<N;i++){
    var d=document.createElement('div');
    d.className='c'; d.dataset.i=i;
    if(done){
      if(reefs.indexOf(i)>=0){ d.className='c reef'; }
      else if(marks.has(i)){ d.className='c wrong mark'; }
      else if(pings.has(i)){ d.className='c ping'; d.textContent=pings.get(i); }
      else if(false){}
      else if(ruledOut(i)) d.className='c out';
    } else if(pings.has(i)){
      d.className = pings.get(i)===0 ? 'c ping mark' : 'c ping';
      d.textContent=pings.get(i);
    } else if(ruledOut(i)){
      d.className='c out';
    } else {
      var r=ringCount(i);
      if(r) d.className='c r'+Math.min(3,r);
      if(marks.has(i)) d.className+=' mark';
    }
    d.addEventListener('click', tap);
    b.appendChild(d);
  }
  document.getElementById('nping').textContent=PINGS-pings.size;
  document.getElementById('nmark').textContent=marks.size;
  document.getElementById('reveal').disabled = done || marks.size===0;
  hint();
}

function tap(e){
  if(done) return;
  var i=+e.currentTarget.dataset.i;
  if(mode==='mark'){
    if(pings.has(i)||ruledOut(i)) return;
    if(marks.has(i)) marks.delete(i);
    else if(marks.size<REEFS) marks.add(i);
  } else {
    if(pings.has(i)||ruledOut(i)||pings.size>=PINGS) return;
    var d=reading(i);
    pings.set(i,d);
    if(d===0 && marks.size<REEFS) marks.add(i);     // pinged it directly: that is a find
    if(pings.size>=PINGS) setMode('mark');
  }
  draw();
  if(tut.on) tut.check();
}

function setMode(m){
  mode=m;
  document.getElementById('mping').className = m==='ping'?'on':'';
  document.getElementById('mmark').className = m==='mark'?'on':'';
}

// One short line. It reacts to the board, and it never explains twice.
function hint(){
  var t=document.getElementById('tip');
  if(tut.on){ t.textContent=''; return; }
  if(done){ t.textContent=''; return; }
  if(!pings.size){ t.textContent='Tap a square to ping it.'; return; }
  if(mode==='mark'){
    t.textContent = marks.size<REEFS ? 'Tap the squares you think hold reefs.' : 'Ready. Hit Reveal.';
    return;
  }
  var best=0;
  for(var i=0;i<N;i++) if(!pings.has(i)&&!ruledOut(i)) best=Math.max(best,ringCount(i));
  if(best>=2){ t.textContent='Darker squares sit on two rings. A reef is probably there.'; return; }
  if(PINGS-pings.size<=2){ t.textContent='Nearly out of pings. Switch to Mark when you are ready.'; return; }
  t.textContent='Grey squares are empty for certain. Ping somewhere new.';
}

function reveal(){
  done=true; draw();
  var hit=0; marks.forEach(function(m){ if(reefs.indexOf(m)>=0) hit++; });
  var msg = hit===REEFS ? 'All four. Clean sweep.'
    : hit===0 ? 'None of them. The reefs are shown in green.'
    : 'You found '+hit+' of '+REEFS+'.';
  document.getElementById('result').textContent = msg+'  ('+pings.size+' pings)';
}

/* The tutorial is played, not read. Each step waits for the player to actually do
   the thing before it moves on. */
var tut={ on:false, i:0,
  steps:[
    {step:'The goal', text:'Four reefs are hidden under this water. You have 10 sonar pings to work out where they are.', wait:null},
    {step:'Step 1', text:'Tap any square to ping it. Go ahead, pick one.', wait:function(){return pings.size>=1;}},
    {step:'Step 2', text:'That number is how far away the nearest reef is. So every square closer than that is empty. They just went grey.', wait:null},
    {step:'Step 3', text:'The orange squares are exactly that far away. One of them has a reef on it. Ping somewhere else to narrow it down.', wait:function(){return pings.size>=2;}},
    {step:'Step 4', text:'Every ping draws a ring, and every ring has a reef somewhere on it. Keep pinging. Squares that land on two rings at once go darker orange, and that is where the reefs are.', wait:null},
    {step:'One more thing', text:'Small numbers mean you are close. A 0 means you are sitting on a reef. When you have worked it out, hit Mark reef, tap your four squares, then Reveal.', wait:null}
  ],
  start:function(){ this.on=true; this.i=0; this.show(); hint(); },
  show:function(){
    var s=this.steps[this.i], teach=document.getElementById('teach');
    if(!s){ this.stop(); return; }
    document.getElementById('cstep').textContent=s.step;
    document.getElementById('ctext').textContent = (typeof s.text==='function') ? s.text() : s.text;
    // a step that waits for a tap shows no button: the board is the button
    teach.className = s.wait ? 'show waiting' : 'show';
  },
  next:function(){ this.i++; this.show(); },
  check:function(){
    var s=this.steps[this.i];
    if(s && s.wait && s.wait()){ this.i++; this.show(); }
  },
  stop:function(){ this.on=false;
    document.getElementById('teach').className='';
    try{ localStorage.setItem('reef.taught','1'); }catch(e){}
    hint(); }
};

document.getElementById('mping').addEventListener('click',function(){ setMode('ping'); draw(); });
document.getElementById('mmark').addEventListener('click',function(){ setMode('mark'); draw(); });
document.getElementById('reveal').addEventListener('click',reveal);
document.getElementById('again').addEventListener('click',function(){ build(); });
document.getElementById('howto').addEventListener('click',function(){ build(); tut.start(); });
document.getElementById('cnext').addEventListener('click',function(){ tut.next(); });
document.getElementById('cskip').addEventListener('click',function(){ tut.stop(); });

var q=(location.search||'').match(/[?&]seed=(\d+)/);
build(q? +q[1] : null);
var taught=false; try{ taught=!!localStorage.getItem('reef.taught'); }catch(e){}
if(!taught) tut.start();

if(typeof globalThis!=='undefined') globalThis.Reef={
  build:build,reading:reading,ruledOut:ruledOut,ringCount:ringCount,
  getReefs:function(){return reefs;},ping:function(i){pings.set(i,reading(i));},
  mark:function(i){marks.add(i);},getMarks:function(){return marks;},
  getPings:function(){return pings;},reveal:reveal,
  COLS:COLS,ROWS:ROWS,REEFS:REEFS,PINGS:PINGS,SEP:SEP,N:N,dist:dist,xy:xy};
</script>
</body>
</html>
